name: Deployment Worker Develop Pipeline

on:
  push:
    branches:
      - develop

concurrency:
  group: develop-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code_quality:
    name: Code Quality
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven verify (skip tests)
        run: mvn --batch-mode --no-transfer-progress verify -DskipTests

  tests:
    name: Tests
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven clean test
        run: mvn --batch-mode --no-transfer-progress clean test

  docker_build:
    name: Docker Build
    runs-on: self-hosted
    needs:
      - code_quality
      - tests
    outputs:
      commit_sha: ${{ steps.image_metadata.outputs.commit_sha }}
      latest_tag: ${{ steps.image_metadata.outputs.latest_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Use Linux Docker CLI
        shell: bash
        run: |
          set -euo pipefail
          linux_path=/usr/bin
          IFS=':' read -r -a path_entries <<< "${PATH}"
          for entry in "${path_entries[@]}"; do
            case "${entry}" in
              ""|/usr/bin|*/Microsoft/WindowsApps|*/Microsoft/WindowsApps/) continue ;;
            esac
            linux_path="${linux_path}:${entry}"
          done
          export PATH="${linux_path}"
          hash -r
          echo "PATH=${PATH}" >> "${GITHUB_ENV}"
          echo "/usr/bin" >> "${GITHUB_PATH}"
          docker_cli=$(command -v docker) || {
            echo "::error::Linux Docker CLI is missing. Install Docker in WSL at /usr/bin/docker."
            exit 1
          }
          echo "Docker CLI: ${docker_cli}"
          if [[ "${docker_cli}" != /usr/bin/docker ]]; then
            echo "::error::Expected the WSL Linux Docker CLI at /usr/bin/docker."
            exit 1
          fi
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application jar
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Compute image metadata
        id: image_metadata
        run: |
          set -euo pipefail

          echo "commit_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          echo "latest_tag=latest" >> "${GITHUB_OUTPUT}"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            victodomvar/scaffoldops-deployment-worker:${{ steps.image_metadata.outputs.latest_tag }}
            victodomvar/scaffoldops-deployment-worker:${{ steps.image_metadata.outputs.commit_sha }}

  docker_push:
    name: Docker Push
    runs-on: self-hosted
    needs:
      - docker_build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Use Linux Docker CLI
        shell: bash
        run: |
          set -euo pipefail
          linux_path=/usr/bin
          IFS=':' read -r -a path_entries <<< "${PATH}"
          for entry in "${path_entries[@]}"; do
            case "${entry}" in
              ""|/usr/bin|*/Microsoft/WindowsApps|*/Microsoft/WindowsApps/) continue ;;
            esac
            linux_path="${linux_path}:${entry}"
          done
          export PATH="${linux_path}"
          hash -r
          echo "PATH=${PATH}" >> "${GITHUB_ENV}"
          echo "/usr/bin" >> "${GITHUB_PATH}"
          docker_cli=$(command -v docker) || {
            echo "::error::Linux Docker CLI is missing. Install Docker in WSL at /usr/bin/docker."
            exit 1
          }
          echo "Docker CLI: ${docker_cli}"
          if [[ "${docker_cli}" != /usr/bin/docker ]]; then
            echo "::error::Expected the WSL Linux Docker CLI at /usr/bin/docker."
            exit 1
          fi
          docker version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build application jar
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Check Docker Hub credentials
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          missing=false
          if [[ -z "${DOCKER_USERNAME}" ]]; then
            echo "::error::DOCKER_USERNAME is not configured. Add a repository secret or grant this repository access to the organization secret."
            missing=true
          fi
          if [[ -z "${DOCKER_PASSWORD}" ]]; then
            echo "::error::DOCKER_PASSWORD is not configured. Add a Docker Hub access token as a repository secret or grant this repository access to the organization secret."
            missing=true
          fi
          if [[ "${missing}" == true ]]; then
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            victodomvar/scaffoldops-deployment-worker:${{ needs.docker_build.outputs.latest_tag }}
            victodomvar/scaffoldops-deployment-worker:${{ needs.docker_build.outputs.commit_sha }}

  deploy:
    name: Deploy to DEV
    needs:
      - docker_build
      - docker_push
    uses: ./.github/workflows/deploy-k8s.yml
    with:
      namespace: scaffoldops-dev
      generated_namespace: generated-dev
      environment_name: DEV
      image_version: latest
