apiVersion: v1
kind: Namespace
metadata:
  name: generated-dev
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-worker
  namespace: scaffoldops-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaffoldops-deployer
  namespace: generated-dev
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaffoldops-deployer
  namespace: generated-dev
subjects:
  - kind: ServiceAccount
    name: deployment-worker
    namespace: scaffoldops-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scaffoldops-deployer
